name: Deploy to GitHub Pages

on:
  # Every push to main is built and published.
  push:
    branches: [main]
  # And it can be run by hand from the Actions tab.
  workflow_dispatch:

# What the jobs need: to read the repository and to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one in progress rather than cutting it off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build (npm run build) and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
